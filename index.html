<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>智旅 AI 探险家 - 智能旅游规划</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;700&display=swap" rel="stylesheet">
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
    <style>
        body { font-family: 'Noto Sans SC', 'Inter', sans-serif; }
        .glass { background: rgba(255, 255, 255, 0.8); backdrop-filter: blur(10px); }
        
        /* 修复：移除 transform 以免破坏 fixed 元素的定位基准 */
        @keyframes fade-in { from { opacity: 0; } to { opacity: 1; } }
        .animate-fade-in { animation: fade-in 0.4s ease-out forwards; }
        
        /* 新增：弹窗弹出动画 */
        @keyframes pop { from { opacity: 0; transform: scale(0.95) translateY(10px); } to { opacity: 1; transform: scale(1) translateY(0); } }
        .animate-pop { animation: pop 0.3s cubic-bezier(0.34, 1.56, 0.64, 1) forwards; }

        #map-container { height: 400px; width: 100%; border-radius: 1rem; }
        .custom-scrollbar::-webkit-scrollbar { width: 4px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #e2e8f0; border-radius: 10px; }
        .amap-info-window { border-radius: 1rem; overflow: hidden; box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1); }
        .amap-info-content { padding: 0 !important; border: none !important; border-radius: 1rem !important; }
        /* 确保地图控件不会遮挡我们的全局模态框 (z-index 4000+) */
        .leaflet-top, .leaflet-bottom { z-index: 400 !important; }
    </style>
    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
    <script type="text/javascript">
        (function() {
            var amapConfig = { key: '3a726610738d8f089602517596041a06', securityCode: 'df586d116238b975d16853245037d2f9' };
            try {
                var saved = localStorage.getItem('amap_config');
                if (saved) {
                    var parsed = JSON.parse(saved);
                    if (parsed.key) amapConfig.key = parsed.key;
                    if (parsed.securityCode) amapConfig.securityCode = parsed.securityCode;
                }
            } catch(e) {}

            window._AMapSecurityConfig = {
                securityJsCode: amapConfig.securityCode,
            };

            var script = document.createElement('script');
            script.type = 'text/javascript';
            script.src = 'https://webapi.amap.com/maps?v=2.0&key=' + amapConfig.key + '&plugin=AMap.Driving,AMap.Walking,AMap.Riding,AMap.Transfer';
            document.head.appendChild(script);
        })();
    </script>
<script type="importmap">
{
  "imports": {
    "react-dom/": "https://esm.sh/react-dom@^19.2.3/",

    "@google/genai": "https://esm.sh/@google/genai@^1.34.0",
    "recharts": "https://esm.sh/recharts@^3.6.0"
  }
}
</script>
<link rel="stylesheet" href="/index.css">
</head>

</body>
</html>
